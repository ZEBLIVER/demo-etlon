# РЎР±РѕСЂРєР° Рё РїСѓР±Р»РёРєР°С†РёСЏ РґРµРјРѕ РЅР° GitHub Pages РїСЂРё РєР°Р¶РґРѕРј push РІ main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA: РїСЂСЏРјС‹Рµ СЃСЃС‹Р»РєРё Рё F5 РЅР° /demo-etlon/locations/... РѕС‚РґР°СЋС‚ РїСЂРёР»РѕР¶РµРЅРёРµ РІРјРµСЃС‚Рѕ 404
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
